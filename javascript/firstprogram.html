<body>

<pre>

<hr>

<input type="text" id="cityName" value="PUNE">
<button onclick="showCity()">Show City Name</button>
<p id="paraDemo"></p>
<script>
    function showCity(){
        cName=document.getElementById("cityName").value 
        document.getElementById("paraDemo").textContent = "Your city is " + cName
    }
</script>
    
    
    
    <script>

        function showAlert(){
            alert("Hello from alert")
        }
        console.log("***Hello from console.....****")
        document.write("######Hello from document write######")
        function surprise(){
            document.write("HA HA HA ALL CLEAR")
        }
        
   </script>
   <script>
    function getUser(){
        uName = prompt("Enter Name")

        document.getElementById("userName").textContent = uName
    }
    getUser()
   </script>
